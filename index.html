<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HM Global — Espace Interne</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--hm-dark:#3c2850;--hm-rose:#b83468;--hm-blue:#4a9ec5;--hm-purple:#6a2a8a;--hm-dark2:#2a1c3a;--hm-light:#f5f0f8;}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
body{background:var(--hm-dark);min-height:100vh;}
.screen{display:none;}.screen.active{display:flex;}
#login{min-height:100vh;flex-direction:column;align-items:center;justify-content:center;background:var(--hm-dark);}
.lbox{background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.15);border-radius:14px;padding:28px;width:360px;}
.lbox input{background:rgba(255,255,255,0.08);border:0.5px solid rgba(255,255,255,0.2);color:#fff;font-size:13px;width:100%;border-radius:8px;padding:9px 12px;outline:none;}
.lbox input::placeholder{color:rgba(255,255,255,0.35);}
.flab{font-size:12px;color:rgba(255,255,255,0.55);display:block;margin-bottom:5px;}
.drow{padding:9px 11px;border-radius:8px;background:rgba(255,255,255,0.06);display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:5px;border:0.5px solid rgba(255,255,255,0.1);transition:border-color .15s;}
.drow:hover{border-color:var(--hm-blue);}
#app{flex-direction:column;min-height:100vh;background:var(--hm-light);}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:52px;background:var(--hm-dark);flex-shrink:0;}
.mwrap{display:flex;flex:1;}
.sbar{width:190px;background:var(--hm-dark2);padding:14px 10px;display:flex;flex-direction:column;flex-shrink:0;min-height:calc(100vh - 52px);}
.nlabel{font-size:10px;color:rgba(255,255,255,0.35);font-weight:500;text-transform:uppercase;letter-spacing:.08em;padding:0 8px;margin-bottom:8px;}
.nbtn{display:block;width:100%;text-align:left;padding:9px 11px;border-radius:7px;border:none;cursor:pointer;font-size:13px;background:transparent;color:rgba(255,255,255,0.55);transition:all .15s;margin-bottom:2px;}
.nbtn.active{background:var(--hm-rose);color:#fff;font-weight:500;}
.nbtn:hover:not(.active){background:rgba(255,255,255,0.08);color:#fff;}
.cont{flex:1;padding:22px;overflow-y:auto;background:var(--hm-light);}
.card{background:#fff;border:0.5px solid rgba(60,40,80,0.12);border-radius:12px;padding:14px;}
.chov{cursor:pointer;transition:border-color .15s;}.chov:hover{border-color:var(--hm-rose);}
.scard{background:#fff;border:0.5px solid rgba(60,40,80,0.12);border-radius:8px;padding:12px;}
.avt{width:36px;height:36px;border-radius:50%;background:var(--hm-rose);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0;}
.avlg{width:48px;height:48px;border-radius:50%;background:var(--hm-dark);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;flex-shrink:0;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500;}
.bok{background:#e8f5f0;color:#2a7a5a;}.bwip{background:#fdf0f5;color:var(--hm-rose);}.bwait{background:#f0f0f5;color:#888;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;}
.stit{font-size:17px;font-weight:500;color:var(--hm-dark);margin-bottom:14px;}
.smut{font-size:13px;color:#888;margin-bottom:18px;}
.bbtn{background:none;border:none;cursor:pointer;color:var(--hm-rose);font-size:13px;padding:0;margin-bottom:14px;}
.micbtn{width:68px;height:68px;border-radius:50%;border:none;cursor:pointer;background:var(--hm-rose);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto;transition:all .2s;box-shadow:0 4px 18px rgba(184,52,104,0.35);}
.micbtn.lst{background:#c0392b;}
.lbtn{flex:1;padding:8px;border-radius:8px;border:0.5px solid rgba(60,40,80,0.15);background:transparent;cursor:pointer;font-size:13px;color:#888;}
.lbtn.active{border-color:var(--hm-dark);background:var(--hm-dark);color:#fff;font-weight:500;}
.tbox{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tpan{background:var(--hm-light);border-radius:8px;padding:12px;border:0.5px solid rgba(60,40,80,0.1);}
.tlng{font-size:11px;font-weight:500;color:var(--hm-rose);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.ttxt{font-size:13px;color:var(--hm-dark);line-height:1.6;}
.abtn{background:var(--hm-dark);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;transition:background .15s;}
.abtn:hover{background:var(--hm-rose);}
.gbtn{background:none;border:0.5px solid rgba(60,40,80,0.2);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#888;}
.stat-bar{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--hm-rose),var(--hm-blue));}
.hm-wm{font-size:14px;font-weight:800;letter-spacing:.05em;}
.hm-wm .hm{color:#4a9ec5;}.hm-wm .gl{color:#c060a0;}
input,select{border:0.5px solid rgba(60,40,80,0.2);border-radius:8px;padding:8px 10px;font-size:13px;outline:none;background:#fff;color:#333;width:100%;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="login" class="screen active">
  <div style="text-align:center;margin-bottom:26px;">
    <div class="hm-wm" style="font-size:30px;margin-bottom:6px;"><span class="hm">HM</span> <span class="gl">GLOBAL</span></div>
    <div style="font-size:9px;color:rgba(255,255,255,0.4);letter-spacing:.18em;text-transform:uppercase;">Agence de Communication</div>
    <div style="font-size:11px;color:rgba(255,255,255,0.25);margin-top:8px;">Espace collaborateur interne</div>
  </div>
  <div class="lbox">
    <div style="margin-bottom:13px;"><label class="flab">Email</label><input id="li-email" type="email" placeholder="email@hmglobal.fr" style="background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.2);color:#fff;"/></div>
    <div style="margin-bottom:18px;"><label class="flab">Mot de passe</label><input id="li-pass" type="password" placeholder="••••••••" style="background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.2);color:#fff;" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <div id="li-err" style="color:#f1948a;font-size:12px;text-align:center;margin-bottom:10px;display:none;"></div>
    <button onclick="doLogin()" id="li-btn" style="width:100%;padding:10px;font-size:14px;background:var(--hm-rose);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:500;">Se connecter</button>
  </div>
</div>

<div id="app" class="screen">
  <div class="hdr">
    <div><div class="hm-wm"><span class="hm">HM</span> <span class="gl">GLOBAL</span></div><div style="font-size:8px;color:rgba(255,255,255,0.3);letter-spacing:.1em;text-transform:uppercase;">Agence de Communication</div></div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="avt" id="hd-av"></div>
      <span style="font-size:12px;color:rgba(255,255,255,0.6);" id="hd-nm"></span>
      <button onclick="doLogout()" style="font-size:11px;color:rgba(255,255,255,0.35);background:none;border:none;cursor:pointer;">Déconnexion</button>
    </div>
  </div>
  <div class="mwrap">
    <div class="sbar">
      <div class="nlabel">Navigation</div>
      <div id="snav" style="flex:1;"></div>
      <div style="border-top:0.5px solid rgba(255,255,255,0.08);padding-top:12px;">
        <div style="background:rgba(255,255,255,0.05);border-radius:8px;padding:9px 11px;">
          <div style="font-size:13px;font-weight:500;color:#fff;" id="sb-nm"></div>
          <div style="font-size:11px;color:rgba(255,255,255,0.35);" id="sb-rl"></div>
        </div>
      </div>
    </div>
    <div class="cont" id="cont"><div style="text-align:center;padding:40px;color:#aaa;"><span class="spinner" style="border-color:rgba(60,40,80,0.2);border-top-color:var(--hm-rose);"></span></div></div>
  </div>
</div>

<script>
const SUPA_URL = 'https://nvufbzepicxubxdxutph.supabase.co';
const SUPA_KEY = 'sb_publishable_aN_ivcfpLzujhkoblpNB0w_GapMeD0V';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

let me = null, tab = '', cid = null, vLang = 'fr-FR', vText = '', vTrans = '', rec = null;
const G = id => document.getElementById(id);
const today = () => new Date().toISOString().split('T')[0];

async function api(table, opts = {}) {
  let q = sb.from(table);
  if (opts.select) q = q.select(opts.select);
  if (opts.eq) Object.entries(opts.eq).forEach(([k, v]) => q = q.eq(k, v));
  if (opts.insert) q = q.insert(opts.insert);
  if (opts.order) q = q.order(opts.order);
  const { data, error } = await q;
  if (error) console.error(error);
  return data || [];
}

async function doLogin() {
  const email = G('li-email').value.trim();
  const pass = G('li-pass').value;
  G('li-err').style.display = 'none';
  G('li-btn').innerHTML = '<span class="spinner"></span>';
  const { data } = await sb.from('users').select('*').eq('email', email).eq('password', pass);
  G('li-btn').textContent = 'Se connecter';
  if (!data || !data.length) { G('li-err').textContent = 'Email ou mot de passe incorrect'; G('li-err').style.display = 'block'; return; }
  me = data[0];
  G('login').classList.remove('active');
  G('app').classList.add('active');
  G('hd-av').textContent = me.name.slice(0,2).toUpperCase();
  G('hd-nm').textContent = me.name;
  G('sb-nm').textContent = me.name;
  G('sb-rl').textContent = me.role === 'admin' ? 'Directeur' : 'Collaborateur senior';
  setupNav();
  sw(me.role === 'admin' ? 'dashboard' : 'planning');
}

function doLogout() { me = null; cid = null; G('app').classList.remove('active'); G('login').classList.add('active'); }

function setupNav() {
  const tabs = me.role === 'admin'
    ? [{id:'dashboard',l:'Tableau de bord'},{id:'collaborateurs',l:'Collaborateurs'},{id:'clients',l:'Clients'}]
    : [{id:'planning',l:'Mon Planning'},{id:'vocal',l:'Note Vocale'},{id:'projets',l:'Mes Projets'}];
  G('snav').innerHTML = tabs.map(t => `<button class="nbtn" id="n-${t.id}" onclick="sw('${t.id}')">${t.l}</button>`).join('');
}

function sw(t) { cid = null; tab = t; document.querySelectorAll('.nbtn').forEach(b => b.classList.remove('active')); G(`n-${t}`)?.classList.add('active'); render(); }

function render() {
  if (cid !== null) { rCollab(); return; }
  ({dashboard: rDash, collaborateurs: rCollabs, clients: rClients, planning: rPlan, vocal: rVocal, projets: rProjets}[tab])?.();
}

const bdg = s => `<span class="badge ${s==='terminé'?'bok':s==='en cours'?'bwip':'bwait'}">${s}</span>`;

async function rDash() {
  G('cont').innerHTML = '<div style="text-align:center;padding:40px;"><span class="spinner" style="border-color:rgba(60,40,80,0.2);border-top-color:var(--hm-rose);"></span></div>';
  const [users, tasks, clients] = await Promise.all([
    sb.from('users').select('*').eq('role','collab').then(r=>r.data||[]),
    sb.from('tasks').select('*').then(r=>r.data||[]),
    sb.from('clients').select('*').then(r=>r.data||[])
  ]);
  const ec = tasks.filter(t=>t.status==='en cours').length;
  const th = tasks.reduce((s,t)=>s+(t.hours||0),0).toFixed(0);
  G('cont').innerHTML = `
    <h1 class="stit">Bonjour, ${me.name} 👋</h1>
    <p class="smut">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>
    <div class="g4" style="margin-bottom:22px;">
      ${[{i:'📋',v:tasks.length,l:'Tâches',c:'var(--hm-dark)'},{i:'⏱',v:th+'h',l:'Heures',c:'var(--hm-rose)'},{i:'🏢',v:clients.length,l:'Clients',c:'var(--hm-blue)'},{i:'🔄',v:ec,l:'En cours',c:'var(--hm-purple)'}]
        .map(s=>`<div class="scard" style="text-align:center;"><div style="font-size:18px;margin-bottom:5px;">${s.i}</div><div style="font-size:20px;font-weight:500;color:${s.c};">${s.v}</div><div style="font-size:11px;color:#999;margin-top:2px;">${s.l}</div></div>`).join('')}
    </div>
    <div style="font-size:14px;font-weight:500;color:var(--hm-dark);margin-bottom:12px;">Collaborateurs</div>
    <div class="g2">
      ${users.map(c => {
        const ct = tasks.filter(t=>t.user_id===c.id);
        const h = ct.reduce((s,t)=>s+(t.hours||0),0).toFixed(1);
        return `<div class="card chov" onclick="viewC('${c.id}')">
          <div style="display:flex;align-items:center;gap:11px;margin-bottom:13px;">
            <div class="avlg">${c.name.slice(0,2).toUpperCase()}</div>
            <div><div style="font-size:14px;font-weight:500;color:var(--hm-dark);">${c.name}</div><div style="font-size:11px;color:#999;">Collaborateur senior</div></div>
          </div>
          <div class="g3">
            ${[{l:'Tâches',v:ct.length,c:'var(--hm-dark)'},{l:'Heures',v:h+'h',c:'var(--hm-rose)'},{l:'En cours',v:ct.filter(t=>t.status==='en cours').length,c:'var(--hm-blue)'}]
              .map(s=>`<div style="background:var(--hm-light);border-radius:7px;padding:7px;text-align:center;"><div style="font-size:15px;font-weight:500;color:${s.c};">${s.v}</div><div style="font-size:10px;color:#999;">${s.l}</div></div>`).join('')}
          </div>
          <div style="margin-top:10px;font-size:12px;color:var(--hm-rose);">Voir le profil →</div>
        </div>`;
      }).join('')}
    </div>`;
}

async function rCollabs() {
  G('cont').innerHTML = '<h1 class="stit">Collaborateurs</h1><div style="text-align:center;padding:30px;"><span class="spinner" style="border-color:rgba(60,40,80,0.2);border-top-color:var(--hm-rose);"></span></div>';
  const [users, tasks] = await Promise.all([
    sb.from('users').select('*').eq('role','collab').then(r=>r.data||[]),
    sb.from('tasks').select('*').then(r=>r.data||[])
  ]);
  G('cont').innerHTML = `<h1 class="stit">Collaborateurs</h1>
    ${users.map(c => {
      const ct = tasks.filter(t=>t.user_id===c.id);
      const h = ct.reduce((s,t)=>s+(t.hours||0),0).toFixed(1);
      return `<div class="card chov" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;" onclick="viewC('${c.id}')">
        <div style="display:flex;align-items:center;gap:13px;"><div class="avlg">${c.name.slice(0,2).toUpperCase()}</div>
        <div><div style="font-size:14px;font-weight:500;color:var(--hm-dark);">${c.name}</div><div style="font-size:12px;color:#999;">${c.email}</div></div></div>
        <div style="display:flex;gap:18px;align-items:center;">
          <div style="text-align:center;"><div style="font-size:17px;font-weight:500;color:var(--hm-rose);">${ct.length}</div><div style="font-size:10px;color:#999;">tâches</div></div>
          <div style="text-align:center;"><div style="font-size:17px;font-weight:500;color:var(--hm-blue);">${h}h</div><div style="font-size:10px;color:#999;">heures</div></div>
          <span style="color:var(--hm-rose);">→</span>
        </div>
      </div>`;
    }).join('')}`;
}

async function viewC(uid) { cid = uid; rCollab(); }

async function rCollab() {
  G('cont').innerHTML = '<div style="text-align:center;padding:40px;"><span class="spinner" style="border-color:rgba(60,40,80,0.2);border-top-color:var(--hm-rose);"></span></div>';
  const [uRes, tasks, notes, clients] = await Promise.all([
    sb.from('users').select('*').eq('id', cid).then(r=>r.data?.[0]),
    sb.from('tasks').select('*, clients(name)').eq('user_id', cid).order('date', {ascending:false}).then(r=>r.data||[]),
    sb.from('notes').select('*').eq('user_id', cid).order('date', {ascending:false}).then(r=>r.data||[]),
    sb.from('clients').select('*').then(r=>r.data||[])
  ]);
  const c = uRes;
  const h = tasks.reduce((s,t)=>s+(t.hours||0),0).toFixed(1);
  G('cont').innerHTML = `
    <button class="bbtn" onclick="cid=null;render();">← Retour</button>
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:22px;padding:16px;background:#fff;border-radius:12px;border:0.5px solid rgba(60,40,80,0.1);">
      <div class="avlg" style="width:52px;height:52px;">${c.name.slice(0,2).toUpperCase()}</div>
      <div style="flex:1;">
        <div style="font-size:18px;font-weight:500;color:var(--hm-dark);">${c.name}</div>
        <div style="font-size:12px;color:#999;margin-bottom:8px;">Collaborateur senior · ${c.email}</div>
        <div class="stat-bar" style="width:${Math.min(100,parseFloat(h)/20*100)}%;"></div>
      </div>
    </div>
    <div class="g3" style="margin-bottom:22px;">
      ${[{l:'Tâches',v:tasks.length,c:'var(--hm-dark)'},{l:'Heures',v:h+'h',c:'var(--hm-rose)'},{l:'En cours',v:tasks.filter(t=>t.status==='en cours').length,c:'var(--hm-blue)'}]
        .map(s=>`<div class="scard" style="text-align:center;"><div style="font-size:20px;font-weight:500;color:${s.c};margin-bottom:3px;">${s.v}</div><div style="font-size:11px;color:#999;">${s.l}</div></div>`).join('')}
    </div>
    <div style="font-size:13px;font-weight:500;color:var(--hm-dark);margin-bottom:10px;">Tâches</div>
    ${tasks.length ? tasks.map(t=>`<div class="card" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <div><div style="font-size:13px;font-weight:500;color:var(--hm-dark);margin-bottom:2px;">${t.title}</div>
      <div style="font-size:11px;color:#999;">🏢 ${t.clients?.name||'—'} · 📅 ${t.date} · ⏱ ${t.hours}h</div></div>
      ${bdg(t.status)}</div>`).join('') : '<p style="font-size:13px;color:#999;margin-bottom:16px;">Aucune tâche.</p>'}
    <div style="font-size:13px;font-weight:500;color:var(--hm-dark);margin:18px 0 10px;">Notes vocales</div>
    ${notes.length ? notes.map(n=>`<div class="card" style="margin-bottom:9px;">
      <div style="font-size:11px;color:#999;margin-bottom:9px;">📅 ${n.date}</div>
      <div class="tbox">
        <div class="tpan"><div class="tlng">🇫🇷 Français</div><div class="ttxt">${n.fr||''}</div></div>
        <div class="tpan"><div class="tlng" style="color:var(--hm-blue);">🇹🇷 Türkçe</div><div class="ttxt">${n.tr||''}</div></div>
      </div></div>`).join('') : '<p style="font-size:13px;color:#999;">Aucune note vocale.</p>'}`;
}

async function rClients() {
  G('cont').innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;"><h1 class="stit" style="margin:0;">Clients</h1><button onclick="showAddC()" class="abtn">+ Ajouter</button></div><div style="text-align:center;padding:30px;"><span class="spinner" style="border-color:rgba(60,40,80,0.2);border-top-color:var(--hm-rose);"></span></div>';
  const [clients, tasks] = await Promise.all([
    sb.from('clients').select('*').order('name').then(r=>r.data||[]),
    sb.from('tasks').select('client_id').then(r=>r.data||[])
  ]);
  const ic = ['🔥','🔨','🍽️','🏠','⚡','🎨','🚗','🏗️'];
  G('cont').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
      <h1 class="stit" style="margin:0;">Clients</h1>
      <button onclick="showAddC()" class="abtn">+ Ajouter</button>
    </div>
    <div id="acf" style="display:none;margin-bottom:14px;"></div>
    <div class="g2">
      ${clients.map((c,i)=>`<div class="card">
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:10px;">
          <div style="width:36px;height:36px;border-radius:9px;background:var(--hm-light);display:flex;align-items:center;justify-content:center;font-size:17px;">${ic[i%ic.length]}</div>
          <div><div style="font-size:13px;font-weight:500;color:var(--hm-dark);">${c.name}</div><div style="font-size:11px;color:#999;">${c.sector||''}</div></div>
        </div>
        <div style="font-size:11px;color:#aaa;">📍 ${c.ville||''}</div>
        <div style="font-size:12px;color:var(--hm-rose);margin-top:8px;">${tasks.filter(t=>t.client_id===c.id).length} tâche(s)</div>
      </div>`).join('')}
    </div>`;
}

function showAddC() {
  G('acf').style.display='block';
  G('acf').innerHTML=`<div class="card"><div style="font-size:13px;font-weight:500;color:var(--hm-dark);margin-bottom:10px;">Nouveau client</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;">
      <input id="nc-n" placeholder="Nom du client"/><input id="nc-s" placeholder="Secteur"/><input id="nc-v" placeholder="Ville"/>
    </div>
    <div style="display:flex;gap:7px;"><button onclick="addC()" class="abtn">Enregistrer</button><button onclick="G('acf').style.display='none'" class="gbtn">Annuler</button></div>
  </div>`;
}

async function addC() {
  const n = G('nc-n').value.trim(); if(!n) return;
  await sb.from('clients').insert({name:n, sector:G('nc-s').value.trim(), ville:G('nc-v').value.trim()});
  rClients();
}

async function rPlan() {
  G('cont').innerHTML = '<div style="text-align:center;padding:40px;"><span class="spinner" style="border-color:rgba(60,40,80,0.2);border-top-color:var(--hm-rose);"></span></div>';
  const tasks = await sb.from('tasks').select('*, clients(name)').eq('user_id', me.id).order('date', {ascending:false}).then(r=>r.data||[]);
  const h = tasks.reduce((s,t)=>s+(t.hours||0),0).toFixed(1);
  G('cont').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">
      <h1 class="stit" style="margin:0;">Mon Planning</h1>
      <button onclick="showAddT()" class="abtn">+ Nouvelle tâche</button>
    </div>
    <p class="smut">${tasks.length} tâche(s) · ${h}h total</p>
    <div id="atf" style="display:none;margin-bottom:14px;"></div>
    ${tasks.length ? tasks.map(t=>`<div class="card" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <div><div style="font-size:13px;font-weight:500;color:var(--hm-dark);margin-bottom:2px;">${t.title}</div>
      <div style="font-size:11px;color:#999;">🏢 ${t.clients?.name||'—'} · 📅 ${t.date} · ⏱ ${t.hours}h</div></div>
      ${bdg(t.status)}</div>`).join('')
    : '<div style="text-align:center;padding:40px;color:#ccc;"><div style="font-size:34px;margin-bottom:10px;">📋</div><p style="font-size:13px;">Aucune tâche.</p></div>'}`;
}

async function showAddT() {
  const clients = await sb.from('clients').select('*').order('name').then(r=>r.data||[]);
  G('atf').style.display='block';
  G('atf').innerHTML=`<div class="card"><div style="font-size:13px;font-weight:500;color:var(--hm-dark);margin-bottom:10px;">Nouvelle tâche</div>
    <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:8px;">
      <input id="nt-ti" placeholder="Titre de la tâche"/>
      <select id="nt-cl"><option value="">Client...</option>${clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
      <input id="nt-h" type="number" placeholder="Heures" step="0.5"/>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
      <input id="nt-d" type="date" value="${today()}"/>
      <select id="nt-st"><option value="en cours">En cours</option><option value="terminé">Terminé</option><option value="en attente">En attente</option></select>
    </div>
    <div style="display:flex;gap:7px;"><button onclick="addT()" class="abtn">Enregistrer</button><button onclick="G('atf').style.display='none'" class="gbtn">Annuler</button></div>
  </div>`;
}

async function addT() {
  const ti=G('nt-ti').value.trim(), cl=G('nt-cl').value, h=parseFloat(G('nt-h').value);
  if(!ti||!cl||!h) return;
  await sb.from('tasks').insert({user_id:me.id, client_id:cl, title:ti, hours:h, date:G('nt-d').value, status:G('nt-st').value});
  rPlan();
}

async function rVocal() {
  const notes = await sb.from('notes').select('*').eq('user_id', me.id).order('date', {ascending:false}).then(r=>r.data||[]);
  G('cont').innerHTML = `
    <h1 class="stit">Note Vocale</h1>
    <p class="smut">Parle en français ou en turc — traduit automatiquement</p>
    <div class="card" style="margin-bottom:14px;">
      <div style="display:flex;gap:8px;margin-bottom:20px;">
        <button class="lbtn ${vLang==='fr-FR'?'active':''}" onclick="setVL('fr-FR')">🇫🇷 Français → 🇹🇷 Turc</button>
        <button class="lbtn ${vLang==='tr-TR'?'active':''}" onclick="setVL('tr-TR')">🇹🇷 Türkçe → 🇫🇷 Français</button>
      </div>
      <div style="text-align:center;margin-bottom:20px;">
        <button class="micbtn" id="mb" onclick="startV()">🎙️</button>
        <div id="ms" style="font-size:12px;color:#aaa;margin-top:10px;">Appuie pour parler</div>
      </div>
      <div id="vr" style="display:${vText?'block':'none'};">
        <div class="tbox" style="margin-bottom:12px;">
          <div class="tpan"><div class="tlng">${vLang==='fr-FR'?'🇫🇷 Original':'🇹🇷 Orijinal'}</div><div class="ttxt" id="v-ori">${vText}</div></div>
          <div class="tpan"><div class="tlng" style="color:var(--hm-blue);">${vLang==='fr-FR'?'🇹🇷 Traduction':'🇫🇷 Traduction'}</div><div class="ttxt" id="v-tr">${vTrans||'Traduction en cours...'}</div></div>
        </div>
        <div style="display:flex;gap:7px;"><button onclick="saveN()" class="abtn">💾 Enregistrer</button><button onclick="vText='';vTrans='';rVocal();" class="gbtn">Effacer</button></div>
      </div>
    </div>
    <div style="font-size:13px;font-weight:500;color:var(--hm-dark);margin-bottom:11px;">Notes enregistrées</div>
    ${notes.length ? notes.map(n=>`<div class="card" style="margin-bottom:9px;">
      <div style="font-size:11px;color:#999;margin-bottom:9px;">📅 ${n.date}</div>
      <div class="tbox">
        <div class="tpan"><div class="tlng">🇫🇷 Français</div><div class="ttxt">${n.fr||''}</div></div>
        <div class="tpan"><div class="tlng" style="color:var(--hm-blue);">🇹🇷 Türkçe</div><div class="ttxt">${n.tr||''}</div></div>
      </div></div>`).join('') : '<p style="font-size:13px;color:#aaa;">Aucune note.</p>'}`;
}

function setVL(l) { vLang=l; vText=''; vTrans=''; rVocal(); }

function startV() {
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) { alert('La reconnaissance vocale nécessite Google Chrome.'); return; }
  if(rec) rec.abort();
  rec = new SR(); rec.lang=vLang; rec.continuous=false; rec.interimResults=false;
  rec.onresult = async e => {
    const t = e.results[0][0].transcript; vText=t;
    if(G('v-ori')) G('v-ori').textContent=t;
    if(G('vr')) G('vr').style.display='block';
    const fr=vLang==='fr-FR'?'fr':'tr', to=fr==='fr'?'tr':'fr';
    try {
      const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=${fr}|${to}`);
      const d = await r.json(); vTrans=d.responseData?.translatedText||'—';
    } catch { vTrans='Traduction non disponible'; }
    if(G('v-tr')) G('v-tr').textContent=vTrans;
  };
  rec.onstart = () => { if(G('mb')){G('mb').classList.add('lst');G('mb').textContent='⏹';} if(G('ms'))G('ms').textContent='⏺ En écoute...'; };
  rec.onend = () => { if(G('mb')){G('mb').classList.remove('lst');G('mb').textContent='🎙️';} if(G('ms'))G('ms').textContent='Appuie pour parler'; };
  rec.start();
}

async function saveN() {
  if(!vText) return;
  const isFR = vLang==='fr-FR';
  await sb.from('notes').insert({user_id:me.id, fr:isFR?vText:vTrans, tr:isFR?vTrans:vText, date:today()});
  vText=''; vTrans=''; rVocal();
}

async function rProjets() {
  G('cont').innerHTML = '<div style="text-align:center;padding:40px;"><span class="spinner" style="border-color:rgba(60,40,80,0.2);border-top-color:var(--hm-rose);"></span></div>';
  const tasks = await sb.from('tasks').select('*, clients(name,sector,ville)').eq('user_id', me.id).then(r=>r.data||[]);
  const clientIds = [...new Set(tasks.map(t=>t.client_id))];
  const groups = clientIds.map(cid => ({
    client: tasks.find(t=>t.client_id===cid)?.clients,
    tasks: tasks.filter(t=>t.client_id===cid),
    h: tasks.filter(t=>t.client_id===cid).reduce((s,t)=>s+(t.hours||0),0).toFixed(1)
  }));
  G('cont').innerHTML = `<h1 class="stit">Mes Projets</h1>
    ${groups.length ? groups.map(g=>`<div class="card" style="margin-bottom:13px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
        <div><div style="font-size:14px;font-weight:500;color:var(--hm-dark);">${g.client?.name||'—'}</div>
        <div style="font-size:11px;color:#999;">${g.client?.sector||''} · ${g.client?.ville||''}</div></div>
        <div style="text-align:right;"><div style="font-size:16px;font-weight:500;color:var(--hm-rose);">${g.h}h</div><div style="font-size:10px;color:#999;">total</div></div>
      </div>
      <div class="stat-bar" style="margin-bottom:11px;width:${Math.min(100,parseFloat(g.h)/10*100)}%;"></div>
      ${g.tasks.map(t=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--hm-light);border-radius:7px;margin-bottom:5px;">
        <span style="font-size:12px;color:var(--hm-dark);">${t.title}</span>
        <div style="display:flex;gap:7px;align-items:center;"><span style="font-size:11px;color:#aaa;">${t.hours}h</span>${bdg(t.status)}</div>
      </div>`).join('')}
    </div>`).join('') : '<p style="font-size:13px;color:#aaa;">Aucun projet assigné.</p>'}`;
}
</script>
</body>
</html>
