<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HM Global — Espace Interne</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--hm-dark:#3c2850;--hm-rose:#b83468;--hm-blue:#4a9ec5;--hm-purple:#6a2a8a;--hm-dark2:#2a1c3a;--hm-light:#f5f0f8;}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
body{background:var(--hm-dark);min-height:100vh;}
.screen{display:none;}.screen.active{display:flex;}
#login{min-height:100vh;flex-direction:column;align-items:center;justify-content:center;background:var(--hm-dark);}
.lbox{background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.15);border-radius:14px;padding:28px;width:360px;}
.lbox input{background:rgba(255,255,255,0.08);border:0.5px solid rgba(255,255,255,0.2);color:#fff;font-size:13px;width:100%;border-radius:8px;padding:9px 12px;outline:none;}
.lbox input::placeholder{color:rgba(255,255,255,0.35);}
.flab{font-size:12px;color:rgba(255,255,255,0.55);display:block;margin-bottom:5px;}
.drow{padding:9px 11px;border-radius:8px;background:rgba(255,255,255,0.06);display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:5px;border:0.5px solid rgba(255,255,255,0.1);transition:border-color .15s;}
.drow:hover{border-color:var(--hm-blue);}
#app{flex-direction:column;min-height:100vh;background:var(--hm-light);}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:52px;background:var(--hm-dark);flex-shrink:0;}
.mwrap{display:flex;flex:1;}
.sbar{width:190px;background:var(--hm-dark2);padding:14px 10px;display:flex;flex-direction:column;flex-shrink:0;min-height:calc(100vh - 52px);}
.nlabel{font-size:10px;color:rgba(255,255,255,0.35);font-weight:500;text-transform:uppercase;letter-spacing:.08em;padding:0 8px;margin-bottom:8px;}
.nbtn{display:block;width:100%;text-align:left;padding:9px 11px;border-radius:7px;border:none;cursor:pointer;font-size:13px;background:transparent;color:rgba(255,255,255,0.55);transition:all .15s;margin-bottom:2px;}
.nbtn.active{background:var(--hm-rose);color:#fff;font-weight:500;}
.nbtn:hover:not(.active){background:rgba(255,255,255,0.08);color:#fff;}
.cont{flex:1;padding:22px;overflow-y:auto;background:var(--hm-light);}
.card{background:#fff;border:0.5px solid rgba(60,40,80,0.12);border-radius:12px;padding:14px;}
.chov{cursor:pointer;transition:border-color .15s;}.chov:hover{border-color:var(--hm-rose);}
.scard{background:#fff;border:0.5px solid rgba(60,40,80,0.12);border-radius:8px;padding:12px;}
.avt{width:36px;height:36px;border-radius:50%;background:var(--hm-rose);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0;}
.avlg{width:48px;height:48px;border-radius:50%;background:var(--hm-dark);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;flex-shrink:0;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500;}
.bok{background:#e8f5f0;color:#2a7a5a;}.bwip{background:#fdf0f5;color:var(--hm-rose);}.bwait{background:#f0f0f5;color:#888;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;}
.stit{font-size:17px;font-weight:500;color:var(--hm-dark);margin-bottom:14px;}
.smut{font-size:13px;color:#888;margin-bottom:18px;}
.bbtn{background:none;border:none;cursor:pointer;color:var(--hm-rose);font-size:13px;padding:0;margin-bottom:14px;}
.micbtn{width:68px;height:68px;border-radius:50%;border:none;cursor:pointer;background:var(--hm-rose);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto;transition:all .2s;box-shadow:0 4px 18px rgba(184,52,104,0.35);}
.micbtn.lst{background:#c0392b;}
.lbtn{flex:1;padding:8px;border-radius:8px;border:0.5px solid rgba(60,40,80,0.15);background:transparent;cursor:pointer;font-size:13px;color:#888;}
.lbtn.active{border-color:var(--hm-dark);background:var(--hm-dark);color:#fff;font-weight:500;}
.tbox{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tpan{background:var(--hm-light);border-radius:8px;padding:12px;border:0.5px solid rgba(60,40,80,0.1);}
.tlng{font-size:11px;font-weight:500;color:var(--hm-rose);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.ttxt{font-size:13px;color:var(--hm-dark);line-height:1.6;}
.abtn{background:var(--hm-dark);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;transition:background .15s;}
.abtn:hover{background:var(--hm-rose);}
.gbtn{background:none;border:0.5px solid rgba(60,40,80,0.2);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#888;}
.stat-bar{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--hm-rose),var(--hm-blue));}
.hm-wm{font-size:14px;font-weight:800;letter-spacing:.05em;}
.hm-wm .hm{color:#4a9ec5;}.hm-wm .gl{color:#c060a0;}
input,select{border:0.5px solid rgba(60,40,80,0.2);border-radius:8px;padding:8px 10px;font-size:13px;outline:none;background:#fff;color:#333;width:100%;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Emploi du temps */
.edt-wrap{overflow-x:auto;}
.edt-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;min-width:640px;}
.edt-day{background:#fff;border:0.5px solid rgba(60,40,80,0.12);border-radius:10px;min-height:120px;overflow:hidden;}
.edt-day.today{border-color:var(--hm-rose);border-width:1.5px;}
.edt-day-hdr{padding:8px 10px;border-bottom:0.5px solid rgba(60,40,80,0.08);display:flex;align-items:center;justify-content:space-between;}
.edt-day-name{font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.06em;}
.edt-day-num{font-size:16px;font-weight:600;color:var(--hm-dark);}
.edt-day.today .edt-day-num{color:#fff;background:var(--hm-rose);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;}
.edt-task{margin:6px 6px 0;padding:5px 8px;border-radius:6px;font-size:11px;background:var(--hm-light);border-left:3px solid var(--hm-rose);color:var(--hm-dark);line-height:1.4;}
.edt-task.done{border-left-color:#2a7a5a;opacity:0.4;}
.edt-task.wait{border-left-color:#e67e22;}
.edt-task-cl{font-size:10px;color:#aaa;margin-top:2px;}
.edt-empty{padding:12px 10px;font-size:11px;color:#ccc;text-align:center;}
.week-nav{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.wnbtn{background:none;border:0.5px solid rgba(60,40,80,0.2);border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--hm-dark);}
.wnbtn:hover{background:var(--hm-dark);color:#fff;}
.week-label{font-size:13px;font-weight:500;color:var(--hm-dark);}

/* Admin emploi du temps - vue par collab */
.edt-collab-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:12px;background:#fff;border-radius:10px;border:0.5px solid rgba(60,40,80,0.1);}

/* Retours utilisateur : bandeaux, confirmation, erreurs de champ */
#toasts{position:fixed;right:18px;bottom:18px;z-index:9999;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.toast{display:flex;align-items:center;gap:9px;min-width:230px;max-width:340px;padding:11px 14px;border-radius:10px;font-size:13px;color:#fff;box-shadow:0 6px 22px rgba(42,28,58,0.28);animation:toastin .22s ease;}
.toast.tok{background:#2a7a5a;}
.toast.terr{background:#c0392b;}
.toast-x{background:none;border:none;color:rgba(255,255,255,0.85);cursor:pointer;font-size:13px;padding:0 0 0 4px;line-height:1;}
@keyframes toastin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.modal-ov{position:fixed;inset:0;background:rgba(42,28,58,0.55);display:flex;align-items:center;justify-content:center;z-index:10000;padding:18px;}
.modal{background:#fff;border-radius:14px;padding:22px;width:360px;max-width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(42,28,58,0.4);}
.modal-title{font-size:15px;font-weight:600;color:var(--hm-dark);margin-bottom:8px;}
.modal-msg{font-size:13px;color:#555;line-height:1.5;margin-bottom:18px;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;}
.abtn-danger{background:#c0392b;}.abtn-danger:hover{background:#a93226;}
.field-err{color:#c0392b;font-size:11px;margin-top:5px;}
input.field-bad,select.field-bad{border-color:#c0392b;}
/* Formulaire de tâche (modale) */
.modal-body{flex:1;overflow-y:auto;margin:2px 0 14px;padding-right:2px;}
.tf-label{font-size:11px;color:#888;display:block;margin:12px 0 5px;font-weight:500;}
.tf-label:first-child{margin-top:0;}
.modal textarea{width:100%;border:0.5px solid rgba(60,40,80,0.2);border-radius:8px;padding:8px 10px;font-size:13px;min-height:56px;font-family:inherit;resize:vertical;outline:none;color:#333;}
.tf-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.seg{display:flex;gap:6px;}
.seg-btn{flex:1;padding:9px 4px;border:0.5px solid rgba(60,40,80,0.2);background:#fff;border-radius:8px;cursor:pointer;font-size:12px;color:#666;transition:all .12s;}
.seg-btn.on{color:#fff;font-weight:500;border-color:var(--hm-dark);background:var(--hm-dark);}
.seg-btn.on.s-attente{background:#e67e22;border-color:#e67e22;}
.seg-btn.on.s-termine{background:#2a7a5a;border-color:#2a7a5a;}
/* Charge par jour + tâche terminée */
.edt-charge{padding:5px 10px 0;font-size:10px;color:#888;line-height:1.4;}
.edt-charge .over{color:#c0392b;font-weight:700;}
.edt-charge .bloq{color:#e67e22;}
.edt-charge.libre{color:#c3bcd0;}
.edt-task.done .et-title{text-decoration:line-through;}
/* Barre de navigation du bas (mobile) */
#botnav{display:none;}
.bnbtn{flex:0 0 auto;background:none;border:none;color:rgba(255,255,255,0.6);font-size:11px;padding:8px 12px;cursor:pointer;border-radius:8px;white-space:nowrap;}
.bnbtn.active{background:var(--hm-rose);color:#fff;font-weight:500;}
/* Mobile : colonnes empilées + barre du bas */
@media (max-width:700px){
  .sbar{display:none;}
  .mwrap{display:block;}
  .cont{padding:16px 14px 78px;}
  .edt-wrap{overflow-x:visible;}
  .edt-grid{grid-template-columns:1fr;min-width:0;gap:10px;}
  .edt-day{min-height:auto;}
  .hdr{padding:0 12px;}
  #botnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--hm-dark2);border-top:0.5px solid rgba(255,255,255,0.1);padding:6px 8px;gap:4px;overflow-x:auto;z-index:900;}
  #toasts{right:12px;left:12px;bottom:88px;align-items:stretch;}
  .toast{min-width:0;max-width:100%;}
}
</style>
</head>
<body>

<div id="login" class="screen active">
  <div style="text-align:center;margin-bottom:26px;">
    <div class="hm-wm" style="font-size:30px;margin-bottom:6px;"><span class="hm">HM</span> <span class="gl">GLOBAL</span></div>
    <div style="font-size:9px;color:rgba(255,255,255,0.4);letter-spacing:.18em;text-transform:uppercase;">Agence de Communication</div>
    <div style="font-size:11px;color:rgba(255,255,255,0.25);margin-top:8px;">Espace collaborateur interne</div>
  </div>
  <div class="lbox">
    <div style="margin-bottom:13px;"><label class="flab">Email</label><input id="li-email" type="email" placeholder="email@hmglobal.fr" style="background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.2);color:#fff;"/></div>
    <div style="margin-bottom:18px;"><label class="flab">Mot de passe</label><input id="li-pass" type="password" placeholder="••••••••" style="background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.2);color:#fff;" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <div id="li-err" style="color:#f1948a;font-size:12px;text-align:center;margin-bottom:10px;display:none;"></div>
    <button onclick="doLogin()" id="li-btn" style="width:100%;padding:10px;font-size:14px;background:var(--hm-rose);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:500;">Se connecter</button>
  </div>
</div>

<div id="app" class="screen">
  <div class="hdr">
    <div><div class="hm-wm"><span class="hm">HM</span> <span class="gl">GLOBAL</span></div><div style="font-size:8px;color:rgba(255,255,255,0.3);letter-spacing:.1em;text-transform:uppercase;">Agence de Communication</div></div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="avt" id="hd-av"></div>
      <span style="font-size:12px;color:rgba(255,255,255,0.6);" id="hd-nm"></span>
      <button onclick="doLogout()" style="font-size:11px;color:rgba(255,255,255,0.35);background:none;border:none;cursor:pointer;">Déconnexion</button>
    </div>
  </div>
  <div class="mwrap">
    <div class="sbar">
      <div class="nlabel">Navigation</div>
      <div id="snav" style="flex:1;"></div>
      <div style="border-top:0.5px solid rgba(255,255,255,0.08);padding-top:12px;">
        <div style="background:rgba(255,255,255,0.05);border-radius:8px;padding:9px 11px;">
          <div style="font-size:13px;font-weight:500;color:#fff;" id="sb-nm"></div>
          <div style="font-size:11px;color:rgba(255,255,255,0.35);" id="sb-rl"></div>
        </div>
      </div>
    </div>
    <div class="cont" id="cont"></div>
  </div>
  <nav id="botnav"></nav>
</div>

<script>
const SUPA_URL='https://hxawzmtclzckdalrokvm.supabase.co';
const SUPA_KEY='sb_publishable_266IbTf1YpguIC0spx5eaA_I4hAPQRY';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

let me=null,tab='',cid=null,vLang='fr-FR',vText='',vTrans='',rec=null;
let weekOffset=0;
const G=id=>document.getElementById(id);
const today=()=>new Date().toISOString().split('T')[0];
const DAYS=['Lun','Mar','Mer','Jeu','Ven','Sam'];
// Échappe le HTML : empêche toute injection de code (XSS) via les données affichées.
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function getWeekDates(offset=0){
  const now=new Date();
  const day=now.getDay()||7;
  const mon=new Date(now);
  mon.setDate(now.getDate()-day+1+offset*7);
  return Array.from({length:6},(_,i)=>{
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    return d.toISOString().split('T')[0];
  });
}

function fmtDate(d){return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});}

function loadSpin(){return '<div style="text-align:center;padding:40px;"><span class="spinner" style="border-color:rgba(60,40,80,0.2);border-top-color:var(--hm-rose);"></span></div>';}

// ─────────── Retours utilisateur (génériques, réutilisables) ───────────
let clientsCache=[];          // dernière liste de clients chargée (pour retrouver un nom)
let currentView=null;         // dernière vue affichée (pour le bouton « Réessayer »)

// Transforme une réponse Supabase en données, ou lève une erreur si échec.
const pick=r=>{if(r.error)throw r.error;return r.data||[];};

// Bandeau : vert 2,5 s (résultat OK) · rouge 5 s avec ✕ (échec).
function toast(msg,type='ok'){
  let box=G('toasts');
  if(!box){box=document.createElement('div');box.id='toasts';document.body.appendChild(box);}
  const t=document.createElement('div');
  t.className='toast '+(type==='err'?'terr':'tok');
  t.innerHTML=`<span>${type==='err'?'✗':'✓'}</span><span style="flex:1;">${esc(msg)}</span>`;
  if(type==='err'){const x=document.createElement('button');x.className='toast-x';x.textContent='✕';x.onclick=()=>t.remove();t.appendChild(x);}
  box.appendChild(t);
  setTimeout(()=>t.remove(),type==='err'?5000:2500);
}

// Confirmation bloquante avant une action irréversible. Renvoie true/false.
// `message` peut contenir du HTML déjà échappé (ex. le nom en gras).
function confirmAction({title,message,confirmLabel='Confirmer',danger=false}){
  return new Promise(resolve=>{
    const ov=document.createElement('div');ov.className='modal-ov';
    ov.innerHTML=`<div class="modal">
      <div class="modal-title">${esc(title)}</div>
      <div class="modal-msg">${message}</div>
      <div class="modal-btns">
        <button class="gbtn" data-a="0">Annuler</button>
        <button class="abtn${danger?' abtn-danger':''}" data-a="1">${esc(confirmLabel)}</button>
      </div></div>`;
    const done=v=>{ov.remove();resolve(v);};
    ov.addEventListener('click',e=>{
      const a=e.target.getAttribute&&e.target.getAttribute('data-a');
      if(a==='1')return done(true);
      if(a==='0'||e.target===ov)return done(false);
    });
    document.body.appendChild(ov);
  });
}

// Désactive un bouton + libellé « en cours » pendant l'écriture (anti double-clic).
async function withBusy(btn,label,fn){
  if(!btn)return fn();
  const orig=btn.innerHTML,wasDis=btn.disabled;
  btn.disabled=true;btn.innerHTML=`<span class="spinner"></span>${label?' '+esc(label):''}`;
  try{return await fn();}
  finally{btn.disabled=wasDis;btn.innerHTML=orig;}
}

// Message rouge sous un champ — reste tant que ce n'est pas corrigé.
function fieldError(id,msg){
  const f=G(id);if(!f)return;
  let e=G('fe-'+id);
  if(!e){e=document.createElement('div');e.id='fe-'+id;e.className='field-err';f.insertAdjacentElement('afterend',e);}
  e.textContent=msg;f.classList.add('field-bad');
}
function clearFieldError(id){const e=G('fe-'+id);if(e)e.remove();const f=G(id);if(f)f.classList.remove('field-bad');}

// Encart affiché quand un écran de lecture ne parvient pas à charger.
function loadErrorCard(){return `<div class="card" style="text-align:center;padding:28px;"><div style="font-size:24px;margin-bottom:8px;">⚠️</div><div style="font-size:13px;color:var(--hm-dark);margin-bottom:16px;">Impossible de charger les données.</div><button class="abtn" onclick="retryView()">Réessayer</button></div>`;}

// Affiche une vue avec spinner + capture des erreurs de chargement.
async function show(fn){
  currentView=fn;
  G('cont').innerHTML=loadSpin();
  try{await fn();}catch(e){G('cont').innerHTML=loadErrorCard();}
}
function retryView(){if(currentView)show(currentView);}

async function doLogin(){
  const email=G('li-email').value.trim(),pass=G('li-pass').value;
  G('li-err').style.display='none';
  G('li-btn').innerHTML='<span class="spinner"></span>';
  try{
    const{error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){G('li-err').textContent='Email ou mot de passe incorrect';G('li-err').style.display='block';return;}
    const ok=await loadMeAndEnter();
    if(!ok){await sb.auth.signOut();G('li-err').textContent="Profil introuvable. Contacte l'administrateur.";G('li-err').style.display='block';}
  }catch(e){
    G('li-err').textContent='Connexion impossible (problème réseau ?). Réessaie.';
    G('li-err').style.display='block';
  }finally{
    G('li-btn').textContent='Se connecter';
  }
}

// Charge le profil de l'utilisateur connecté puis ouvre l'application.
// Appelée après une connexion réussie ET au chargement si une session existe déjà.
async function loadMeAndEnter(){
  const{data:{user}}=await sb.auth.getUser();
  if(!user)return false;
  const{data:prof}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(!prof)return false;
  me={...prof,email:prof.email||user.email};
  G('li-pass').value='';
  G('login').classList.remove('active');G('app').classList.add('active');
  G('hd-av').textContent=(me.name||'?').slice(0,2).toUpperCase();
  G('hd-nm').textContent=me.name;G('sb-nm').textContent=me.name;
  G('sb-rl').textContent=me.role==='admin'?'Directeur':'Collaborateur senior';
  setupNav();sw(me.role==='admin'?'dashboard':'emploi');
  return true;
}

async function doLogout(){await sb.auth.signOut();me=null;cid=null;weekOffset=0;G('app').classList.remove('active');G('login').classList.add('active');}

function setupNav(){
  const tabs=me.role==='admin'
    ?[{id:'dashboard',l:'Tableau de bord',m:'Bord'},{id:'monplanning',l:'Mon Planning',m:'Moi'},{id:'emploi',l:'Emploi du temps',m:'Équipe'},{id:'collaborateurs',l:'Collaborateurs',m:'Collabs'},{id:'clients',l:'Clients',m:'Clients'}]
    :[{id:'emploi',l:'Mon Planning',m:'Planning'},{id:'vocal',l:'Note Vocale',m:'Vocal'},{id:'projets',l:'Mes Projets',m:'Projets'}];

function weekLabel(dates){
  return `${fmtDate(dates[0])} — ${fmtDate(dates[5])}`;
}

function navBar(){
  return `<div class="week-nav">
    <button class="wnbtn" onclick="weekOffset--;render()">← Semaine préc.</button>
    <button class="wnbtn" onclick="weekOffset=0;render()">Aujourd'hui</button>
    <button class="wnbtn" onclick="weekOffset++;render()">Semaine suiv. →</button>
    <span class="week-label" id="wk-lbl"></span>
  </div>`;
}

function dayCharge(dayTasks){
  const sum=st=>dayTasks.filter(t=>t.status===st).reduce((s,t)=>s+(+t.hours||0),0);
  const aFaire=sum('en cours'), bloque=sum('en attente');
  const fh=n=>Number.isInteger(n)?(''+n):(''+n).replace('.',',');
  if(aFaire===0&&bloque===0) return `<div class="edt-charge libre">libre</div>`;
  let s=`<span class="${aFaire>7?'over':''}">${fh(aFaire)} h à faire</span>`;
  if(bloque>0) s+=` <span class="bloq">· ${fh(bloque)} h bloquées</span>`;
  return `<div class="edt-charge">${s}</div>`;
}

function renderEdtCollab(dates,tasks){
  const todayStr=today();
  let html=`
    <h1 class="stit">Mon Planning</h1>
    ${navBar()}
    <div class="edt-wrap">
      <div class="edt-grid">`;

  dates.forEach((d,i)=>{
    const dayTasks=tasks.filter(t=>t.date===d);
    const isToday=d===todayStr;
    html+=`<div class="edt-day${isToday?' today':''}"${isToday?' data-today="1"':''}>
      <div class="edt-day-hdr">
        <span class="edt-day-name">${DAYS[i]}</span>
        <span class="edt-day-num">${isToday?`<div class="edt-day-num">${new Date(d+'T12:00:00').getDate()}</div>`:new Date(d+'T12:00:00').getDate()}</span>
      </div>
      ${dayCharge(dayTasks)}`;
    if(dayTasks.length){
      dayTasks.forEach(t=>{
        const cls=t.status==='terminé'?'done':t.status==='en attente'?'wait':'';
        html+=`<div class="edt-task ${cls}" style="cursor:pointer;" onclick="openTaskModal('${t.id}')">
          <div class="et-title" style="font-weight:500;">${esc(t.title)}</div>
          <div class="edt-task-cl">🏢 ${esc(t.clients?.name||'—')} · ⏱ ${t.hours}h</div>
        </div>`;
      });
    } else {
      html+=`<div class="edt-empty">—</div>`;
    }
    html+=`<div style="height:6px;"></div></div>`;
  });

  html+=`</div></div>
    <div style="margin-top:18px;"><button class="abtn" onclick="openTaskModal(null,'${todayStr}')">+ Nouvelle tâche</button></div>`;

  G('cont').innerHTML=html;
  G('wk-lbl').textContent=weekLabel(dates);
  if(window.matchMedia('(max-width:700px)').matches){const el=document.querySelector('.edt-day[data-today]');if(el)el.scrollIntoView({block:'nearest'});}
}

function renderEdtAdmin(dates,users,allTasks){
  const todayStr=today();
  let html=`
    <h1 class="stit">Emploi du temps</h1>
    ${navBar()}`;

  users.forEach(u=>{
    const userTasks=allTasks.filter(t=>t.user_id===u.id);
    const totalH=userTasks.reduce((s,t)=>s+(t.hours||0),0).toFixed(1);
    html+=`<div style="margin-bottom:24px;">
      <div class="edt-collab-hdr">

      </div>

    dates.forEach((d,i)=>{
      const dayTasks=userTasks.filter(t=>t.date===d);

      html+=`<div class="edt-day${isToday?' today':''}">
        <div class="edt-day-hdr">
          <span class="edt-day-name">${DAYS[i]}</span>
          <span class="edt-day-num">${new Date(d+'T12:00:00').getDate()}</span>
        </div>`;
      if(dayTasks.length){
        dayTasks.forEach(t=>{
          const cls=t.status==='terminé'?'done':t.status==='en attente'?'wait':'';
          html+=`<div class="edt-task ${cls}">

        html+=`<div class="edt-empty">—</div>`;
      }
      html+=`<div style="height:6px;"></div></div>`;
    });
    html+=`</div></div></div>`;
  });

  G('cont').innerHTML=html;
  G('wk-lbl').textContent=weekLabel(dates);
}

let sirenTimer=null,sirenResults=[];
function searchSiren(val){
  clearTimeout(sirenTimer);
  G('nc-results').innerHTML='';
  if(val.length<3)return;
  sirenTimer=setTimeout(async()=>{
    G('nc-spin').style.display='flex';
    try{
      const url=`https://recherche-entreprises.api.gouv.fr/search?q=${encodeURIComponent(val)}&limit=5`;
      const r=await fetch(url);
      const d=await r.json();
      G('nc-spin').style.display='none';
      sirenResults=d.results||[];
      if(!sirenResults.length){G('nc-results').innerHTML='<p style="font-size:11px;color:#aaa;margin-top:4px;">Aucun résultat trouvé</p>';return;}
      G('nc-results').innerHTML=sirenResults.map((e,i)=>{
        const nom=e.nom_complet||e.nom_raison_sociale||'—';
        const siren=e.siren||'';
        const ville=e.siege?.libelle_commune||'';
        const cp=e.siege?.code_postal||'';
        const activite=e.activite_principale_libelle||e.section_activite_principale||'';
        return`<div data-siren="${i}" style="padding:8px 10px;border-radius:7px;background:var(--hm-light);cursor:pointer;margin-bottom:5px;border:0.5px solid rgba(60,40,80,0.1);transition:border-color .15s;" onmouseover="this.style.borderColor='var(--hm-rose)'" onmouseout="this.style.borderColor='rgba(60,40,80,0.1)'">
          <div style="font-size:12px;font-weight:500;color:var(--hm-dark);">${esc(nom)}</div>
          <div style="font-size:10px;color:#aaa;margin-top:2px;">SIREN ${esc(siren)} · ${esc(cp)} ${esc(ville)} · ${esc(activite.slice(0,40))}</div>
        </div>`;
      }).join('');
      G('nc-results').querySelectorAll('[data-siren]').forEach(el=>el.addEventListener('click',()=>{
        const e=sirenResults[+el.dataset.siren];if(!e)return;
        selectEntreprise(e.nom_complet||e.nom_raison_sociale||'—',e.siren||'',e.siege?.libelle_commune||'',e.siege?.code_postal||'',e.activite_principale_libelle||e.section_activite_principale||'',e.siege?.code_naf||'');
      }));
    }catch(e){G('nc-spin').style.display='none';G('nc-results').innerHTML='<p style="font-size:11px;color:#c0392b;">Erreur de connexion à l\'API</p>';}
  },400);
}

      name:n,sector:G('nc-s').value.trim(),ville:G('nc-v').value.trim(),
      siren:G('nc-siren')?.value?.trim()||null
    }).then(pick));
    toast('Client ajouté.');
    render();
  }catch(e){toast("Impossible d'ajouter le client.",'err');}
}

// ═══════════════════════════════════════
// FORMULAIRE DE TÂCHE (modale) — créer / modifier
// ═══════════════════════════════════════
let taskModalId=null;          // id de la tâche éditée (null = création)
let taskModalStatus='en cours';

async function openTaskModal(id,dateISO){
  taskModalId=id||null;
  let clients=[],t=null;
  try{
    clients=await sb.from('clients').select('*').order('name').then(pick);
    if(taskModalId){ t=await sb.from('tasks').select('*').eq('id',taskModalId).maybeSingle().then(r=>{if(r.error)throw r.error;return r.data;}); }
  }catch(e){ toast('Impossible d’ouvrir la tâche.','err'); return; }
  if(taskModalId&&!t){ toast('Tâche introuvable.','err'); return; }

  taskModalStatus = t?t.status:'en cours';
  const note = t&&t.note?t.note:'';
  const dateVal = t?t.date:(dateISO||today());
  const impVal = t?t.importance:'normale';

  const ov=document.createElement('div');
  ov.className='modal-ov'; ov.id='task-modal';
  ov.innerHTML=`<div class="modal" style="width:420px;">
    <div class="modal-title">${taskModalId?'Modifier la tâche':'Nouvelle tâche'}</div>
    <div class="modal-body">
      <label class="tf-label">Que faut-il faire ?</label>
      <input id="tf-title" placeholder="Ex : Faire le BAT de l'enseigne Naga" value="${esc(t?t.title:'')}" oninput="clearFieldError('tf-title')"/>
      <label class="tf-label">Client</label>
      <select id="tf-client">
        <option value="">— aucun —</option>
        ${clients.map(c=>`<option value="${c.id}"${t&&t.client_id===c.id?' selected':''}>${esc(c.name)}</option>`).join('')}
      </select>
      <div class="tf-row">
        <div><label class="tf-label">Jour</label><input id="tf-date" type="date" value="${esc(dateVal)}"/></div>
        <div><label class="tf-label">Durée (heures)</label><input id="tf-hours" type="number" step="0.5" min="0.5" placeholder="Ex : 1,5" value="${t?t.hours:''}" oninput="clearFieldError('tf-hours')"/></div>
      </div>
      <label class="tf-label">Statut</label>
      <div class="seg" id="tf-status">
        <button type="button" class="seg-btn" data-v="en cours" onclick="setTaskStatus('en cours')">En cours</button>
        <button type="button" class="seg-btn s-attente" data-v="en attente" onclick="setTaskStatus('en attente')">En attente</button>
        <button type="button" class="seg-btn s-termine" data-v="terminé" onclick="setTaskStatus('terminé')">Terminé</button>
      </div>
      <label class="tf-label">Importance</label>
      <select id="tf-importance">
        ${['faible','normale','haute','urgente'].map(i=>`<option value="${i}"${impVal===i?' selected':''}>${i.charAt(0).toUpperCase()+i.slice(1)}</option>`).join('')}
      </select>
      <label class="tf-label">Note (facultatif)</label>
      <textarea id="tf-note" placeholder="Détails, mesures, ce qu'on attend…">${esc(note)}</textarea>
    </div>
    <div class="modal-btns">
      ${taskModalId?`<button class="gbtn" style="margin-right:auto;color:#c0392b;border-color:rgba(192,57,43,0.4);" onclick="deleteTaskFromModal(this)">Supprimer</button>`:''}
      <button class="gbtn" onclick="closeTaskModal()">Annuler</button>
      <button class="abtn" onclick="saveTask(this)">Enregistrer</button>
    </div>
  </div>`;
  ov.addEventListener('click',e=>{ if(e.target===ov) closeTaskModal(); });
  document.body.appendChild(ov);
  setTaskStatus(taskModalStatus);
}

function setTaskStatus(s){
  taskModalStatus=s;
  document.querySelectorAll('#tf-status .seg-btn').forEach(b=>b.classList.toggle('on', b.dataset.v===s));
}

function closeTaskModal(){ const m=G('task-modal'); if(m)m.remove(); }

async function saveTask(btn){
  clearFieldError('tf-title'); clearFieldError('tf-hours');
  const title=G('tf-title').value.trim();
  const h=parseFloat(G('tf-hours').value);
  let bad=false;
  if(!title){fieldError('tf-title','Indique ce qu’il faut faire.');bad=true;}
  if(!h||h<=0){fieldError('tf-hours','Indique une durée supérieure à 0.');bad=true;}
  if(bad)return;
  const row={
    user_id:me.id, client_id:G('tf-client').value||null,
    title, hours:h, date:G('tf-date').value,
    status:taskModalStatus, importance:G('tf-importance').value,
    note:G('tf-note').value.trim()||null
  };
  try{
    if(taskModalId){
      await withBusy(btn,'Enregistrement…',()=>sb.from('tasks').update(row).eq('id',taskModalId).then(pick));
    }else{
      await withBusy(btn,'Enregistrement…',()=>sb.from('tasks').insert(row).then(pick));
    }
    closeTaskModal();
    toast(taskModalId?'Tâche modifiée.':'Tâche enregistrée.');
    render();
  }catch(e){ toast('Enregistrement impossible.','err'); }
}

async function deleteTaskFromModal(btn){
  const title=G('tf-title').value.trim()||'cette tâche';
  const ok=await confirmAction({title:'Supprimer la tâche',message:`Supprimer <b>${esc(title)}</b> ?<br><span style="color:#c0392b;">Cette action est irréversible.</span>`,confirmLabel:'Supprimer',danger:true});
  if(!ok)return;
  try{
    await withBusy(btn,'Suppression…',()=>sb.from('tasks').delete().eq('id',taskModalId).then(pick));
    closeTaskModal();
    toast('Tâche supprimée.');
    render();
  }catch(e){ toast('Suppression impossible.','err'); }
}

async function rVocal(){
  const notes=await sb.from('notes').select('*').eq('user_id',me.id).order('date',{ascending:false}).then(pick);
  G('cont').innerHTML=`
    <h1 class="stit">Note Vocale</h1>
    <p class="smut">Parle en français ou en turc — traduit automatiquement</p>
    <div class="card" style="margin-bottom:14px;">
      <div style="display:flex;gap:8px;margin-bottom:20px;">
        <button class="lbtn ${vLang==='fr-FR'?'active':''}" onclick="setVL('fr-FR')">🇫🇷 Français → 🇹🇷 Turc</button>
        <button class="lbtn ${vLang==='tr-TR'?'active':''}" onclick="setVL('tr-TR')">🇹🇷 Türkçe → 🇫🇷 Français</button>
      </div>
      <div style="text-align:center;margin-bottom:20px;">
        <button class="micbtn" id="mb" onclick="startV()">🎙️</button>
        <div id="ms" style="font-size:12px;color:#aaa;margin-top:10px;">Appuie pour parler</div>
      </div>
      <div id="vr" style="display:${vText?'block':'none'};">
        <div class="tbox" style="margin-bottom:12px;">
          <div class="tpan"><div class="tlng">${vLang==='fr-FR'?'🇫🇷 Original':'🇹🇷 Orijinal'}</div><div class="ttxt" id="v-ori">${esc(vText)}</div></div>
          <div class="tpan"><div class="tlng" style="color:var(--hm-blue);">${vLang==='fr-FR'?'🇹🇷 Traduction':'🇫🇷 Traduction'}</div><div class="ttxt" id="v-tr">${esc(vTrans)||'Traduction en cours...'}</div></div>
        </div>
        <div style="display:flex;gap:7px;"><button onclick="saveN(this)" class="abtn">💾 Enregistrer</button><button onclick="vText='';vTrans='';render();" class="gbtn">Effacer</button></div>
      </div>
    </div>
    <div style="font-size:13px;font-weight:500;color:var(--hm-dark);margin-bottom:11px;">Notes enregistrées</div>
    ${notes.length?notes.map(n=>`<div class="card" style="margin-bottom:9px;">
      <div style="font-size:11px;color:#999;margin-bottom:9px;">📅 ${esc(n.date)}</div>
      <div class="tbox">
        <div class="tpan"><div class="tlng">🇫🇷 Français</div><div class="ttxt">${esc(n.fr)}</div></div>
        <div class="tpan"><div class="tlng" style="color:var(--hm-blue);">🇹🇷 Türkçe</div><div class="ttxt">${esc(n.tr)}</div></div>
      </div></div>`).join(''):'<p style="font-size:13px;color:#aaa;">Aucune note.</p>'}`;
}

function setVL(l){vLang=l;vText='';vTrans='';render();}

function startV(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('La reconnaissance vocale nécessite Google Chrome.');return;}
  if(rec)rec.abort();
  rec=new SR();rec.lang=vLang;rec.continuous=false;rec.interimResults=false;
  rec.onresult=async e=>{
    const t=e.results[0][0].transcript;vText=t;
    if(G('v-ori'))G('v-ori').textContent=t;
    if(G('vr'))G('vr').style.display='block';
    const fr=vLang==='fr-FR'?'fr':'tr',to=fr==='fr'?'tr':'fr';
    try{const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=${fr}|${to}`);const d=await r.json();vTrans=d.responseData?.translatedText||'—';}
    catch{vTrans='Traduction non disponible';}
    if(G('v-tr'))G('v-tr').textContent=vTrans;
  };
  rec.onstart=()=>{if(G('mb')){G('mb').classList.add('lst');G('mb').textContent='⏹';}if(G('ms'))G('ms').textContent='⏺ En écoute...';};
  rec.onend=()=>{if(G('mb')){G('mb').classList.remove('lst');G('mb').textContent='🎙️';}if(G('ms'))G('ms').textContent='Appuie pour parler';};
  rec.start();
}

async function saveN(btn){
  if(!vText)return;
  const isFR=vLang==='fr-FR';
  try{
    await withBusy(btn,'Enregistrement…',()=>sb.from('notes').insert({user_id:me.id,fr:isFR?vText:vTrans,tr:isFR?vTrans:vText,date:today()}).then(pick));
    toast('Note enregistrée.');
    vText='';vTrans='';render();
  }catch(e){toast('Enregistrement impossible.','err');}
}

async function rProjets(){
  G('cont').innerHTML=loadSpin();
  const tasks=await sb.from('tasks').select('*,clients(name,sector,ville)').eq('user_id',me.id).then(pick);
  const clientIds=[...new Set(tasks.map(t=>t.client_id))];
  const groups=clientIds.map(cid=>({
    client:tasks.find(t=>t.client_id===cid)?.clients,
    tasks:tasks.filter(t=>t.client_id===cid),
    h:tasks.filter(t=>t.client_id===cid).reduce((s,t)=>s+(t.hours||0),0).toFixed(1)
  }));
  G('cont').innerHTML=`<h1 class="stit">Mes Projets</h1>
    ${groups.length?groups.map(g=>`<div class="card" style="margin-bottom:13px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
        <div><div style="font-size:14px;font-weight:500;color:var(--hm-dark);">${esc(g.client?.name||'—')}</div>
        <div style="font-size:11px;color:#999;">${esc(g.client?.sector)} · ${esc(g.client?.ville)}</div></div>
        <div style="text-align:right;"><div style="font-size:16px;font-weight:500;color:var(--hm-rose);">${g.h}h</div><div style="font-size:10px;color:#999;">total</div></div>
      </div>
      <div class="stat-bar" style="margin-bottom:11px;width:${Math.min(100,parseFloat(g.h)/10*100)}%;"></div>
      ${g.tasks.map(t=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--hm-light);border-radius:7px;margin-bottom:5px;">
        <span style="font-size:12px;color:var(--hm-dark);">${esc(t.title)}</span>
        <div style="display:flex;gap:7px;align-items:center;"><span style="font-size:11px;color:#aaa;">${t.hours}h</span>${bdg(t.status)}</div>
      </div>`).join('')}
    </div>`).join(''):'<p style="font-size:13px;color:#aaa;">Aucun projet assigné.</p>'}`;
}
async function delClient(id,btn){
  if(me?.role!=='admin'){toast("Seul l'administrateur peut supprimer un client.",'err');return;}
  const name=clientsCache.find(c=>c.id===id)?.name||'ce client';
  const ok=await confirmAction({
    title:'Supprimer le client',
    message:`Supprimer <b>${esc(name)}</b> et toutes ses tâches ?<br><span style="color:#c0392b;">Cette action est irréversible.</span>`,
    confirmLabel:'Supprimer',danger:true
  });
  if(!ok)return;
  try{
    await withBusy(btn,'Suppression…',async()=>{
      await sb.from('tasks').delete().eq('client_id',id).then(pick);
      await sb.from('clients').delete().eq('id',id).then(pick);
    });
    toast('Client supprimé.');
    render();
  }catch(e){toast('Suppression impossible.','err');}
}

// Au chargement : reprendre une session existante si l'utilisateur est déjà connecté.
(async()=>{ try{ const{data:{session}}=await sb.auth.getSession(); if(session) await loadMeAndEnter(); }catch(e){} })();
</script>
